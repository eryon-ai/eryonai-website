services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    ports:
      - "3000:3000"
    env_file: .env   # SMTP_USER, SMTP_PASS, LEAD_TO_EMAIL, GOOGLE_SHEET_WEBHOOK_URL, RECAPTCHA_SECRET_KEY
    restart: unless-stopped
